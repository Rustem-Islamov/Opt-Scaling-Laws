# =====================
project: "muon-experiment"
run: "muon-demo"
# =====================
# Data
# =====================
input_bin: data/fineweb10B/fineweb_train_*.bin
input_val_bin: data/fineweb10B/fineweb_val_*.bin

# =====================
# Optimization / training
# =====================
batch_size: 512
device_batch_size: 64
sequence_length: 1024
num_iterations: 5100
warmup_iters: 0
warmdown_iters: 1450

# =====================
# Evaluation / logging
# =====================
val_loss_every: 125
val_tokens: 10485760
save_every: 0

# =====================
# Model architecture
# =====================
n_layer: 12
n_head: 6
n_embd: 768

# =====================
# Muon optimizer
# =====================
weight_decay: 0.0
momentum: 0.05
eps: 1e-8

lr_embed: 0.01
lr_matrix: 0.02

beta1: 0.9
beta2: 0.95

a: 0.01
